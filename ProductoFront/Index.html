<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Boostrap/bootstrap/bootstrap/css/bootstrap.min.css">
</head>

<body>

    <div class="row">
        <div class="col-md-3">
            <input type="nombre" id="nombre" placeholder="Nombre">
        </div>

        <div class="col-md-3">
            <input type="nombre" id="descripcion" placeholder="Descripcion">
        </div>

        <div class="col-md-3">
            <input type="nombre" id="precioCosto" placeholder="Precio Costo">
        </div>

        <div class="col-md-3">
            <input type="nombre" id="precioVenta" placeholder="Precio venta ">
        </div>

    </div>


    <table class="table">
        <thead>
            <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Descripcion</th>
                <th scope="col">Precio Costo</th>
                <th scope="col">Precio Venta</th>
            </tr>
        </thead>
        <tbody id="tablaProducto" class="table-group-divider">
        
        </tbody>
    </table>

    <script src="Boostrap/bootstrap/bootstrap/js/bootstrap.min.js"></script>
    <script src="js/Producto.1.0.0.js"></script>
</body>

</html>
